
name: NusaFit Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Check Project Files
        run: |
          echo "Isi repository:"
          ls -la

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: File gradlew tidak ditemukan di root."
            find . -maxdepth 4 \
              \( -name gradlew -o -name settings.gradle \
              -o -name settings.gradle.kts \) -print
            exit 1
          fi

      - name: Grant Gradle Permission
        run: chmod +x ./gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NusaFit-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
